[package]
name = "rspxy"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
quinn-proto = { version = "0.11.18", default-features = false }
rand = "0.10.3"
rcgen = "0.14.10"
ring = "0.17"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
siphasher = "1.0.4"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[profile.release]
strip = true

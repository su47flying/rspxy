name: Release

# Push a tag like v0.1.0 to build the binaries and publish them as a GitHub release.
# Running it by hand (workflow_dispatch) only builds them, as run artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME does not match version $v in Cargo.toml"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          dir=rspxy-$GITHUB_REF_NAME-${{ matrix.name }}
          mkdir "$dir"
          cp README.md LICENSE "$dir"/
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/rspxy.exe "$dir"/
            7z a "$dir.zip" "$dir" > /dev/null
          else
            cp target/${{ matrix.target }}/release/rspxy "$dir"/
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rspxy-${{ matrix.name }}
          path: |
            rspxy-*.zip
            rspxy-*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum rspxy-* > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" * --title "rspxy $GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
